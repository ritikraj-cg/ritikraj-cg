</rect>
<rect x="25" y="25" width="1150" height="280" rx="22" fill="none" stroke="#164e63"/>
<circle cx="1030" cy="80" r="90" fill="#22d3ee" opacity=".08" filter="url(#glow)">
<animate attributeName="r" values="70;110;70" dur="4s" repeatCount="indefinite"/>
</circle>
